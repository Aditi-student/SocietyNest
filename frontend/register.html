<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SocietyNest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html"><span class="brand-mark">S</span>SocietyNest</a>
            <a class="btn btn-nav" href="login.html">Already have an account?</a>
        </div>
    </nav>

    <main class="form-page">
        <form id="registerForm" class="form-card">
            <div class="section-kicker">GET STARTED</div>
            <h1 class="mt-2">Create your profile</h1>
            <p class="subtitle mb-4">Build your student profile once and use it for society applications.</p>

            <div id="registerMessage" class="mb-3"></div>

            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label">Full name</label>
                    <input id="name" class="form-control" placeholder="Your name" required maxlength="100">
                </div>
                <div class="col-12">
                    <label class="form-label">Email</label>
                    <input id="email" type="email" class="form-control" placeholder="you@example.com" required maxlength="255">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Year</label>
                    <select id="year" class="form-select" required>
                        <option value="">Select year</option>
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3">3rd Year</option>
                        <option value="4">4th Year</option>
                        <option value="5">5th Year</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Branch</label>
                    <input id="branch" class="form-control" placeholder="CSE" required maxlength="100">
                </div>
                <div class="col-12">
                    <label class="form-label">Password</label>
                    <input id="password" type="password" class="form-control" placeholder="At least 6 characters" required minlength="6">
                </div>
                <div class="col-12">
                    <label class="form-label">Confirm password</label>
                    <input id="confirmPassword" type="password" class="form-control" placeholder="Repeat password" required minlength="6">
                </div>
            </div>

            <button id="registerButton" class="btn btn-warm w-100 mt-4" type="submit">Create account</button>
            <p class="text-center mt-4 mb-0 muted">Already registered? <a href="login.html" style="color:var(--terra-dark);font-weight:700;">Log in</a></p>
        </form>
    </main>

    <div id="toastContainer"></div>
    <script src="js/auth.js"></script>
</body>
</html>
