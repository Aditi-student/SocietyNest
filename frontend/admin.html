<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | SocietyNest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html"><span class="brand-mark">S</span>SocietyNest</a>
            <div class="d-flex gap-2"><a class="btn btn-nav" href="index.html">View site</a><button class="btn btn-nav-fill" id="logoutBtn">Logout</button></div>
        </div>
    </nav>

    <main class="admin-page">
        <div class="container">
            <div class="section-head"><div><div class="section-kicker">ADMIN PANEL</div><h2>Manage societies & applications</h2><p>Create societies, edit details and manage applicant status.</p></div></div>

            <div class="panel">
                <div class="panel-title" id="societyFormTitle">Create society</div>
                <form id="societyForm" class="row g-3">
                    <input id="societyId" type="hidden">
                    <div class="col-md-6"><label class="form-label">Name</label><input id="sName" class="form-control" required maxlength="100"></div>
                    <div class="col-md-6"><label class="form-label">Category</label><select id="sCategory" class="form-select" required><option value="">Choose category</option><option>Technical</option><option>Cultural</option><option>Sports</option><option>Literary</option><option>Entrepreneurship</option><option>Creative</option></select></div>
                    <div class="col-md-6"><label class="form-label">Tagline</label><input id="sTagline" class="form-control" maxlength="255"></div>
                    <div class="col-md-6"><label class="form-label">Deadline</label><input id="sDeadline" type="datetime-local" class="form-control" required></div>
                    <div class="col-12"><label class="form-label">Description</label><textarea id="sDescription" class="form-control" rows="3" required></textarea></div>
                    <div class="col-md-6"><label class="form-label">Criteria</label><textarea id="sCriteria" class="form-control" rows="2"></textarea></div>
                    <div class="col-md-6"><label class="form-label">Roles</label><textarea id="sRoles" class="form-control" rows="2" placeholder="Web, Design, Events"></textarea></div>
                    <div class="col-12 d-flex gap-2"><button class="btn btn-warm" id="societySubmit" type="submit">Create society</button><button class="btn btn-soft hidden" id="cancelEdit" type="button">Cancel edit</button></div>
                </form>
            </div>

            <div class="panel">
                <div class="panel-title">Societies</div>
                <div id="adminSocieties" class="row g-3"></div>
            </div>

            <div class="panel">
                <div class="panel-title">Applicants</div>
                <div id="applicantArea" class="muted">Choose a society above to view applicants.</div>
            </div>
        </div>
    </main>

    <div id="toastContainer"></div>
    <script src="js/admin.js"></script>
</body>
</html>
